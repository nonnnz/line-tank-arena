<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#bfe6ff" />
<title>LINE Tank Arena 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
<style>
  :root { --orange:#ff7a1a; --ink:#1f2a44; --card:rgba(255,255,255,.88); --green:#06c755;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#bfe6ff; color:var(--ink);
    font-family:"Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight:800;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #hud button, #hud .tap { pointer-events:auto; font:inherit; color:inherit; border:0; cursor:pointer; }
  .card { background:var(--card); border-radius:16px; box-shadow:0 4px 0 rgba(31,42,68,.15), 0 8px 18px rgba(31,42,68,.12); }
  .hidden { display:none !important; }

  #me { position:absolute; left:calc(10px + var(--sl)); top:calc(10px + var(--st)); display:flex; gap:8px; align-items:center; padding:6px 12px 6px 6px; max-width:42vw; }
  #avatar { width:38px; height:38px; border-radius:50%; background:#3b82f6; color:#fff; display:grid; place-items:center; font-size:20px; overflow:hidden; flex:none; border:3px solid #fff; }
  #avatar img { width:100%; height:100%; object-fit:cover; }
  #meName { font-size:14px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #meScore { font-size:13px; color:#e8590c; line-height:1.1; }
  #guestTag { font-size:10px; color:#8a94a8; line-height:1; }

  #lvl { position:absolute; left:50%; transform:translateX(-50%); top:calc(10px + var(--st)); text-align:center; width:min(30vw,220px); }
  #lvlText { font-size:18px; color:#fff; text-shadow:0 2px 0 #1f2a44, 0 0 6px rgba(31,42,68,.5); letter-spacing:1px; }
  .bar { height:12px; background:rgba(31,42,68,.25); border-radius:8px; overflow:hidden; border:2px solid #fff; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4ade80,#06c755); transition:width .25s; }
  #timer { margin-top:4px; font-size:14px; color:#fff; text-shadow:0 2px 0 #1f2a44; }

  #room { position:absolute; right:calc(10px + var(--sr)); top:calc(10px + var(--st)); display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #roomChip { padding:6px 12px; font-size:13px; display:flex; gap:8px; align-items:center; }
  #conn { width:10px; height:10px; border-radius:50%; background:#facc15; box-shadow:0 0 6px currentColor; }
  #conn.ok { background:#22c55e; } #conn.bad { background:#ef4444; }
  .pill { padding:6px 14px; font-size:13px; border-radius:999px !important; }
  #inviteBtn { background:var(--green) !important; color:#fff !important; }
  #rankBtn { background:#fff; }

  #ups { position:absolute; right:calc(10px + var(--sr)); top:calc(150px + var(--st)); display:flex; flex-direction:column; gap:8px; }
  .up { width:74px; padding:5px 8px; text-align:left; font-size:12px; line-height:1.1; position:relative; }
  .up b { display:block; font-size:11px; color:#8a94a8; }
  .up .plus { position:absolute; right:-6px; top:-6px; width:24px; height:24px; border-radius:50%; background:#22c55e; color:#fff; display:none; place-items:center; font-size:18px; box-shadow:0 0 12px #22c55e; animation:pulse 1s infinite; }
  .up.can .plus { display:grid; }
  .up.can { outline:3px solid #22c55e; }

  #joy { position:absolute; left:calc(18px + var(--sl)); bottom:calc(22px + var(--sb)); width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.35); border:3px solid rgba(255,255,255,.8); pointer-events:auto; touch-action:none; }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:#fff; box-shadow:0 4px 0 rgba(31,42,68,.2); }

  #board { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(14px + var(--sb)); padding:6px 12px; font-size:12px; min-width:130px; max-width:34vw; }
  #board div { display:flex; justify-content:space-between; gap:8px; white-space:nowrap; }
  #board div span:first-child { overflow:hidden; text-overflow:ellipsis; }
  #board .mine { color:#06a046; }
  @media (max-width:560px) { #lvl { top:calc(74px + var(--st)); left:calc(10px + var(--sl)); transform:none; width:44vw; } #toasts { top:calc(150px + var(--st)); } #me { max-width:46vw; } #ups { top:calc(178px + var(--st)); } #board { bottom:calc(170px + var(--sb)); left:calc(12px + var(--sl)); transform:none; max-width:46vw; } }

  #fire { position:absolute; right:calc(16px + var(--sr)); bottom:calc(20px + var(--sb)); display:flex; flex-direction:column; align-items:center; gap:4px; }
  #micBtn { width:118px; height:118px; border-radius:50% !important; background:radial-gradient(circle at 35% 30%,#ffd166,#ff7a1a 55%,#e8410c) !important; color:#fff !important;
    box-shadow:0 6px 0 #b8350a, 0 0 28px rgba(255,122,26,.85); font-size:15px !important; line-height:1; text-shadow:0 2px 0 rgba(0,0,0,.25); position:relative; }
  #micBtn .ico { font-size:30px; display:block; }
  #micBtn.cool { filter:grayscale(.75) brightness(.9); box-shadow:0 6px 0 #777; }
  #micBtn.listen::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:5px solid #ffb347; animation:ring 1s infinite; }
  #micBtn:active { transform:translateY(3px); }
  #fireLbl { font-size:12px; color:#fff; text-shadow:0 2px 0 #1f2a44; }
  #fireRow { display:flex; gap:6px; }
  #tapBtn, #langBtn { padding:4px 10px; font-size:12px; }
  #heard { position:absolute; right:calc(16px + var(--sr)); bottom:calc(196px + var(--sb)); max-width:60vw; padding:6px 12px; font-size:13px; }

  #toasts { position:absolute; top:calc(96px + var(--st)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center; width:min(90vw,420px); }
  .toast { padding:6px 14px; font-size:13px; animation:fadein .2s; text-align:center; }
  #banner { position:absolute; top:20%; left:0; right:0; text-align:center; font-size:clamp(34px,11vw,72px); color:#fff;
    text-shadow:0 4px 0 #b8350a, 0 0 30px #ff7a1a; opacity:0; transform:scale(.6); transition:all .25s cubic-bezier(.2,1.6,.4,1); line-height:1; }
  #banner small { display:block; font-size:.32em; text-shadow:0 2px 0 #b8350a; }
  #banner.show { opacity:1; transform:scale(1); }
  #flash { position:fixed; inset:0; background:radial-gradient(circle,#fff3c4,#ff9a3c); opacity:0; pointer-events:none; mix-blend-mode:screen; }

  .overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(191,230,255,.55); pointer-events:auto; backdrop-filter:blur(3px); }
  .overlay .card { padding:18px 22px; text-align:center; max-width:88vw; max-height:80vh; overflow:auto; min-width:260px; }
  #loading { background:linear-gradient(#8fd3ff,#e9f7ff); z-index:10; }
  #loading h1 { margin:0; font-size:clamp(34px,10vw,64px); color:#fff; text-shadow:0 4px 0 #1f6fd1, 0 0 20px rgba(255,255,255,.8); line-height:1; }
  #loading h2 { margin:6px 0 0; color:var(--orange); font-size:22px; }
  #loading p { color:#4b5873; font-size:14px; }
  #death h2 { color:#ef4444; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:3px 6px; text-align:left; } td:last-child { text-align:right; }
  .close { margin-top:10px; background:var(--orange) !important; color:#fff !important; padding:8px 18px; border-radius:999px; font:inherit; border:0; }

  .pill img { width:20px; height:20px; vertical-align:-5px; margin-right:4px; }
  .up { display:grid; grid-template-columns:30px 1fr; column-gap:4px; align-items:center; width:92px !important; }
  .up img { width:30px; height:34px; object-fit:contain; grid-row:span 2; }
  #micBtn { background:url(/ui/skill-fireball.png) center/112% no-repeat, radial-gradient(circle,#ff7a1a,#e8410c) !important; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:12px; }
  #micBtn .mic { position:absolute; right:-6px; top:-6px; width:44px; height:44px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
  #micText { font-size:14px; text-shadow:0 2px 0 #7a1d05, 0 0 6px #7a1d05; }
  img.badge { width:26px; height:22px; object-fit:contain; vertical-align:middle; }
  img.hero { width:64px; height:58px; object-fit:contain; display:block; margin:0 auto -4px; }
  .appicon { width:120px; height:120px; border-radius:28px; display:block; margin:0 auto 12px; box-shadow:0 10px 24px rgba(31,111,209,.35); }
  #startChoice { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #startChoice .close { margin:0; min-width:220px; font-size:17px; padding:11px 22px; }
  .close.line { background:#06c755 !important; }
  .close.guest { background:#fff !important; color:var(--ink) !important; box-shadow:0 3px 0 rgba(31,42,68,.15); }
  #startChoice .close:disabled { opacity:.6; }
  #tsBox:empty { display:none; }
  .close.send { background:var(--green) !important; display:block; margin:12px auto 4px; }
  .close.send:disabled { opacity:.7; }
  @keyframes pulse { 50% { transform:scale(1.15); } }
  @keyframes ring { from { transform:scale(.9); opacity:1; } to { transform:scale(1.25); opacity:0; } }
  @keyframes fadein { from { opacity:0; transform:translateY(-6px); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="me" class="card"><div id="avatar">?</div><div style="min-width:0"><div id="meName">…</div><div id="meScore">0 pts</div><div id="guestTag"></div></div></div>
  <div id="lvl"><div id="lvlText">LEVEL 1</div><div class="bar"><i id="xpFill"></i></div><div id="timer">3:00</div></div>
  <div id="room">
    <button id="roomChip" class="card"><span id="conn"></span><span id="roomText">ROOM -----</span><span id="count">0/12</span></button>
    <button id="inviteBtn" class="card pill"><img src="/ui/icon-share.png" alt="">Invite</button>
    <button id="rankBtn" class="card pill"><img src="/ui/badge-trophy.png" alt="">World Rank</button>
  </div>
  <div id="ups">
    <button class="up card" data-stat="damage" title="Damage"><img src="/ui/upgrade-damage.png" alt="">DMG<b>Lv <span>0</span></b><i class="plus">+</i></button>
    <button class="up card" data-stat="fireRate" title="Fire Rate"><img src="/ui/upgrade-fire-rate.png" alt="">RATE<b>Lv <span>0</span></b><i class="plus">+</i></button>
    <button class="up card" data-stat="maxHp" title="Max HP"><img src="/ui/upgrade-health.png" alt="">HP<b>Lv <span>0</span></b><i class="plus">+</i></button>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <div id="board" class="card"></div>
  <div id="heard" class="card hidden"></div>
  <div id="fire">
    <button id="micBtn" aria-label="Say FIREBALL"><img class="mic" src="/ui/icon-microphone.png" alt=""><span id="micText">Say<br>FIREBALL!</span></button>
    <div id="fireLbl">Tap or Voice</div>
    <div id="fireRow"><button id="tapBtn" class="card pill">🔥 Tap</button><button id="langBtn" class="card pill">EN</button></div>
  </div>
  <div id="toasts"></div>
  <div id="banner"></div>
</div>
<div id="flash"></div>
<div id="death" class="overlay hidden" style="pointer-events:none;background:rgba(239,68,68,.15)"><div class="card"><h2>💥 Destroyed!</h2><div>Respawning…</div></div></div>
<div id="matchEnd" class="overlay hidden"><div class="card"><img class="hero" src="/ui/badge-crown.png" alt=""><h2>Match Over</h2><table id="results"></table><button id="sendResult" class="close send hidden">📩 Send result to LINE</button><div style="font-size:12px;color:#8a94a8">Next match starting soon…</div></div></div>
<div id="rankModal" class="overlay hidden"><div class="card"><img class="hero" src="/ui/badge-trophy.png" alt=""><h2>World Rank</h2><table id="rankTable"></table><button class="close" id="rankClose">Close</button></div></div>
<div id="loading" class="overlay"><div><img class="appicon" src="/ui/app-icon.webp" alt=""><h1>LINE Tank<br>Arena</h1><h2>Shout “FIREBALL!” 🔥</h2><p id="loadMsg">Loading…</p><div id="startChoice" class="hidden"><button id="lineBtn" class="close line">Login with LINE</button><button id="guestBtn" class="close guest">Play as guest</button><div id="tsBox"></div></div></div></div>
<script type="module" src="/src/client/main.ts"></script>
</body>
</html>
